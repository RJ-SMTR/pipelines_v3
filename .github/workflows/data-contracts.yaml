name: Data contract artifacts

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - "staging/**"
    paths:
      - "contracts/**"
      - "pipelines/common/capture/data_contract/*.py"
      - "queries/**"
      - ".github/workflows/data-contracts.yaml"

permissions:
  contents: read

concurrency:
  group: data-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-check:
    name: Generate and check ODCS contracts
    runs-on: ubuntu-latest
    env:
      DBT_USER: github-actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev unixodbc-dev gcc build-essential
          cp queries/dev/profiles-example.yml queries/dev/profiles.yml
          uv sync --all-packages --locked

      - name: Install dbt packages
        working-directory: queries
        run: uv run dbt deps --profiles-dir ./dev

      - name: Parse dbt manifest with dbt Core
        working-directory: queries
        run: uv run dbt parse --profiles-dir ./dev --target prod --no-partial-parse

      - name: Generate contracts from dbt manifest
        run: uv run python -c 'from pipelines.common.capture.data_contract.utils import generate_contracts; generate_contracts()'

      - name: Upload generated contracts
        uses: actions/upload-artifact@v4
        with:
          name: generated-contracts
          path: contracts
          retention-days: 1

  commit-contracts:
    name: Commit contracts to the PR branch
    needs: generate-and-check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Remove versioned contracts
        run: find contracts -type f -name '*.odcs.yaml' -delete 2>/dev/null || true

      - name: Download generated contracts
        uses: actions/download-artifact@v4
        with:
          name: generated-contracts
          path: contracts

      - name: Commit contracts to the PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain -- ':(glob)contracts/**/*.odcs.yaml')" ]; then
            exit 0
          fi
          git add -- ':(glob)contracts/**/*.odcs.yaml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated data contracts"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
