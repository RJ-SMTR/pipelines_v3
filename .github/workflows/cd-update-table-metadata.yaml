name: CD-update-table-metadata

on:
  push:
    branches:
      - master
      - devops/update-table-metadata # TODO: remover antes de mergear na master
    paths:
      - 'queries/**'
      - '.github/scripts/update_table_metadata.py'
      - '.github/workflows/cd-update-table-metadata.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Se marcado, não grava no BigQuery — apenas mostra o que seria alterado"
        type: boolean
        default: true

jobs:
  update-table-metadata:
    name: Update table metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: uv sync --all-packages

      - name: Gera manifest.json
        working-directory: queries
        run: |-
          uv run dbt deps
          uv run dbt parse

      - name: Determina modo de execução
        id: mode
        run: |-
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Atualiza metadados das tabelas
        run: uv run .github/scripts/update_table_metadata.py
        env:
          GKE_SA_KEY: ${{ secrets.GKE_SA_KEY }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
