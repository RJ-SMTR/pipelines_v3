name: Recce Cleanup - PR Environment

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_USER: recce_pr_${{ github.event.pull_request.number }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout PR base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: uv sync --all-packages

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Write BigQuery credentials
        env:
          GCP_SA_KEY: ${{ secrets.GKE_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > /tmp/credentials.json

      - name: Prepare dbt profile
        working-directory: queries
        run: |
          mkdir -p dev
          cp profiles.yml dev/profiles.yml

      - name: Install dbt packages
        working-directory: queries
        run: uv run dbt deps --profiles-dir ./dev

      - name: Drop PR schemas through dbt
        working-directory: queries
        run: |
          uv run dbt run-operation clear_recce_pr_schemas \
            --target dev \
            --profiles-dir ./dev \
            --args "{\"schema_prefix\": \"$DBT_USER\"}"
