version: 2

models:
  - name: aux_viagem_apurada_openfisca
    description: >
      Saída crua do `rio_rac_bus_subsidy.calculate_remuneration`
      (viagens, planejamento) no grão viagem: Tab. 2, picos, frota diária
      (MAX picos), IPA/precária e OPEX. Só o que o OF calcula — o contrato
      completo está em `aux_viagem_apurada`. O pacote devolve
      `indicador_km_pagamento` e não ecoa `period` / `hora_partida` /
      `day_of_week` / `indicador_completa_pico_*`.
    config:
      date_range_start: "{{ var('date_range_start') }}"
      date_range_end: "{{ var('date_range_end') }}"
      invocation_id: "{{ invocation_id }}"

  - name: aux_viagem_apurada
    description: >
      Tabela larga da apuração (52 colunas da planilha Tabelas Remuneração
      Sistema RIO, 2026-09-14). Soma à saída do
      `calculate_remuneration` o que o pacote não devolve: `shape_id`,
      stubs de lote, `id_apuracao`, e deriva `hora_partida` /
      `day_of_week` / `period` / `indicador_completa_pico_*`. Origem de
      `viagem_apurada`, `faixa_apurada` e `data_apurada`.

      Stubs nulos: `indicador_dentro_do_teto_programado` (o OF não ranqueia
      teto) e `servico_tipo` (sem fonte no projeto).
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: dbt_utils__unique_combination_of_columns__aux_viagem_apurada
          arguments:
            combination_of_columns:
              - id_apuracao
    columns:
      - name: id_apuracao
        description: "Identificador único da apuração — data|lote|id_veiculo|partida"
        tests:
          - not_null:
              name: not_null__id_apuracao__aux_viagem_apurada
      - name: data
        description: "{{ doc('data_viagem') }} [partição]"
      - name: id_viagem
        description: "{{ doc('id_viagem') }}"
      - name: shape_id
        description: "{{ doc('shape_id') }}"
      - name: indicador_dentro_do_teto_programado
        description: "Stub nulo — o OpenFisca não ranqueia teto de programadas"
      - name: servico_tipo
        description: "Stub nulo — sem fonte no projeto"

  - name: aux_frota_operante_dia_lote
    description: >
      DEPRECATED — frota diária agora sai de `aux_viagem_apurada` via
      `rio_rac_bus_subsidy.calculate_remuneration`. Mantido só por
      compatibilidade temporária.
      Frota operante diária por lote (Anexo I.8 item 4): maior quantitativo
      de veículos com viagem completa em pico manhã [05h, 09h) ou tarde [16h, 20h).
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: dbt_utils.unique_combination_of_columns__aux_frota_operante_dia_lote
          arguments:
            combination_of_columns:
              - data
              - lote
    columns:
      - name: data
        description: "{{ doc('data_viagem') }} [partição]"
        tests:
          - not_null:
              name: not_null__data__aux_frota_operante_dia_lote
      - name: lote
        description: "Identificador do lote contratual"
        tests:
          - not_null:
              name: not_null__lote__aux_frota_operante_dia_lote
      - name: indicador_dia_util
        description: "Indica se a data é dia útil (segunda a sexta)"
      - name: frota_pico_manha
        description: "Quantidade distinta de veículos com viagem completa partida no pico manhã"
      - name: frota_pico_tarde
        description: "Quantidade distinta de veículos com viagem completa partida no pico tarde"
      - name: frota_operante
        description: "Maior frota entre pico manhã e pico tarde no dia/lote"

  - name: aux_veiculo_status_viagem
    description: >
      Status do veículo em cada viagem válida do Sistema RIO: atributos do
      cadastro (placa, ano de fabricação, tecnologia), tecnologia apurada e
      remunerada conforme a vigência de `tecnologia_servico`, e indicadores de
      licenciamento, vistoria e autuações disciplinares ocorridas durante a
      viagem.
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: dbt_utils__unique_combination_of_columns__aux_veiculo_status_viagem
          arguments:
            combination_of_columns:
              - data
              - id_viagem
    columns:
      - name: data
        description: "{{ doc('data_viagem') }} [partição]"
        tests:
          - not_null:
              name: not_null__data__aux_veiculo_status_viagem
      - name: id_viagem
        description: "{{ doc('id_viagem') }}"
        tests:
          - not_null:
              name: not_null__id_viagem__aux_veiculo_status_viagem
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
        tests:
          - not_null:
              name: not_null__id_veiculo__aux_veiculo_status_viagem
      - name: datetime_partida
        description: "{{ doc('datetime_partida') }}"
      - name: datetime_chegada
        description: "{{ doc('datetime_chegada') }}"
      - name: modo
        description: "{{ doc('modo') }}"
      - name: placa
        description: "{{ doc('placa') }}"
      - name: ano_fabricacao
        description: "{{ doc('ano_fabricacao') }}"
      - name: tecnologia_apurada
        description: "{{ doc('tecnologia') }}"
      - name: tecnologia_remunerada
        description: "{{ doc('tecnologia_remunerada') }}"
      - name: servico
        description: "{{ doc('servico') }}"
      - name: sentido
        description: "{{ doc('sentido') }}"
      - name: distancia_planejada
        description: "{{ doc('distancia_planejada') }}"
      - name: indicador_nao_licenciado
        description: "Indica se o veículo não estava licenciado na data da viagem"
      - name: indicador_nao_vistoriado
        description: "Indica se o veículo não estava vistoriado na data da viagem"
      - name: indicador_lacrado
        description: "Indica se o veículo estava lacrado na data da viagem"
      - name: indicador_nao_autorizado_ausencia_ar
        description: >
          Indica se o veículo não estava autorizado a operar por ausência de ar
          condicionado
      - name: indicador_nao_autorizado_capacidade
        description: >
          Indica se o veículo não estava autorizado a operar por tecnologia de
          capacidade inferior à mínima permitida para o serviço
      - name: indicador_autuado_ar_inoperante
        description: "Indica se o veículo foi autuado por ar condicionado inoperante"
      - name: indicador_autuado_alterar_itinerario
        description: >
          Indica se o veículo foi autuado por alterar o itinerário durante a
          viagem (infração 017.III)
      - name: indicador_autuado_vista_inoperante
        description: >
          Indica se o veículo foi autuado por vista inoperante durante a viagem
          (infração 023.X)
      - name: indicador_autuado_nao_atender_parada
        description: >
          Indica se o veículo foi autuado por não atender ponto de parada
          durante a viagem (infração 029.I)
      - name: indicador_autuado_iluminacao_insuficiente
        description: >
          Indica se o veículo foi autuado por iluminação insuficiente durante a
          viagem (infração 029.XIII)
      - name: indicador_autuado_nao_concluir_itinerario
        description: >
          Indica se o veículo foi autuado por não concluir o itinerário durante
          a viagem (infração 040.I)
      - name: indicador_registrado_ar_inoperante
        description: >
          Indica se o veículo estava registrado com ar condicionado inoperante
      - name: indicadores
        description: "{{ doc('indicadores_veiculo') }}"
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
      - name: versao
        description: "{{ doc('versao') }}"
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
