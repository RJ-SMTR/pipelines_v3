models:
  - name: custo_cloud
    description: Tabela contendo os dados de custo da GCP
    columns:
      - name: data
        description: data de início do uso do recurso
        data_type: date
      - name: tipo_servico
        description: Serviço associado à cobrança
        data_type: string
      - name: sku
        description: Descrição do SKU [variação do serviço associado à cobrança]
        data_type: string
      - name: projeto
        description: "{{ doc('project_id') }}"
        data_type: string
      - name: custo
        description: Custo da utilização do serviço (R$)
        data_type: float64
      - name: taxa_conversao_real
        description: "{{ doc('taxa_conversao_real') }}"
        data_type: float64
      - name: quantidade_uso
        description: Quantidade do serviço que foi utilizado [na unidade da coluna unidade_uso]
        data_type: float64
      - name: unidade_uso
        description: Unidade de referente ao uso da coluna quantidade_uso
        data_type: string
      - name: quantidade_unidade_preco
        description: Quantidade do serviço que foi utilizado em unidades preço
        data_type: float64
      - name: unidade_preco
        description: Unidade de preço do serviço
        data_type: string
      - name: data_particao_fonte
        description: Data da partição da tabela fonte
        data_type: date
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
        data_type: datetime
  - name: log_bigquery
    description: Registro dos jobs concluídos no BigQuery, com uma linha por job e atribuição dos filhos ao processo do pai. Scripts são excluídos para evitar dupla contagem de custos.
    tests:
      - unique:
          name: unique__id_job__log_bigquery
          arguments:
            column_name: id_job
    columns:
      - name: data
        description: Data do evento de conclusão no log de auditoria, em America/Sao_Paulo.
        data_type: date
      - name: datetime_inicio_job
        description: Data e hora reais do início da execução do job em America/Sao_Paulo.
        data_type: datetime
      - name: datetime_fim_job
        description: Data e hora reais do fim da execução do job em America/Sao_Paulo.
        data_type: datetime
      - name: projeto
        description: "{{ doc('project_id') }}"
        data_type: string
      - name: usuario
        description: Usuário que executou o Job
        data_type: string
      - name: metodo
        description: Tipo do Job executado
        data_type: string
      - name: id_job
        description: Identificador único do Job
        data_type: string
      - name: id_job_pai
        description: Identificador completo do job pai, obtido dos metadados de auditoria; nulo para jobs sem pai.
        data_type: string
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
        data_type: string
      - name: tipo_statement
        description: Tipo do statement SQL executado (SELECT, MERGE, INSERT, CREATE_TABLE_AS_SELECT etc.); nulo para jobs que não são queries.
        data_type: string
      - name: status_job
        description: Estado final do job no log de auditoria.
        data_type: string
      - name: codigo_erro_job
        description: Código do erro do job; nulo quando o job terminou sem erro.
        data_type: int64
      - name: mensagem_erro_job
        description: Mensagem do erro do job; nula quando o job terminou sem erro.
        data_type: string
      - name: tabela_destino
        description: Tabela de destino do job no formato projeto.dataset.tabela, quando houver.
        data_type: string
      - name: tabelas_referenciadas
        description: Tabelas lidas pelo job, no formato projeto.dataset.tabela.
        data_type: array<string>
      - name: labels
        description: Labels do job como objeto JSON chave-valor; nulo quando o job não possui labels.
        data_type: json
      - name: query
        description: Query executada, se houver
        data_type: string
      - name: processo_execucao
        description: Processo que executou o Job [nome do Flow, do Dashboard ou nulo]
        data_type: string
      - name: tipo_processo_execucao
        description: Tipo do processo que executou o Job [Flow, Dashboard, Outro]
        data_type: string
      - name: bytes_processados
        description: Quantidade de bytes processados
        data_type: int64
      - name: bytes_faturados
        description: Quantidade de bytes faturados
        data_type: int64
      - name: tib_processados
        description: Quantidade de TiB processados
        data_type: float64
      - name: custo_real
        description: Custo do Job (R$)
        data_type: float64
      - name: valor_tib_real
        description: Valor do TiB (R$)
        data_type: float64
      - name: valor_tib_dolar
        description: Valor do TiB (USD)
        data_type: float64
      - name: taxa_conversao_real
        description: "{{ doc('taxa_conversao_real') }}"
        data_type: float64
      - name: origem_valor
        description: Origem das informações de valor [Real, Fixado Manualmente, Preenchido]
        data_type: string
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
        data_type: datetime
