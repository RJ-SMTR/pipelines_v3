  - name: staging_licenciamento_stu
    description: |
      Uma linha por veículo (`id_veiculo`) por data do arquivo FTP (`data`).
      Mantém o histórico de todas as partições de captura: cada `data` é o recorte do cadastro STU naquele dia, não o estado vigente consolidado.
      Use (`data`, `id_veiculo`) para junções com o arquivo do dia; use (`id_veiculo`, `placa`) ao acompanhar o veículo entre arquivos.
      Fonte: FTP RDO `LICENCIAMENTO/CadastrodeVeiculos`. Lê `veiculo_staging.licenciamento_stu` antes de `data_inicio_source_veiculo` e `source_veiculo.licenciamento_stu` a partir dessa data.
      Premissas: `data` permanece string; datas vazias no JSON viram nulo; `timestamp_captura` é truncado ao segundo em America/Sao_Paulo; não há deduplicação além da chave de captura.

    tests:
      - dbt_expectations.expect_row_values_to_have_data_for_every_n_datepart:
          name: dbt_expectations__expect_row_values_to_have_data_for_every_n_datepart__staging_licenciamento_stu
          arguments:
            date_col: data
            row_condition: "1=1"
            test_start_date: "{{ var('date_range_start') }}"
            test_end_date: "{{ modules.datetime.datetime.fromisoformat(var('date_range_end')) + modules.datetime.timedelta(1) }}"
          config:
            tags: ["freshness", "daily"]
            severity: warn
    columns:
      - name: data
        description: Data do arquivo de licenciamento [partição]
        data_type: string
      - name: timestamp_captura
        description: "{{ doc('datetime_captura') }}"
        data_type: datetime
