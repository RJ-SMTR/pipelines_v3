version: 2

models:
  - name: staging_feed_info
    description: |
      Uma linha por versão do GTFS (data_versao), com os nomes das colunas do arquivo feed_info.txt.
      Fonte: capturas do GTFS (source_gtfs.feed_info).
      O contrato de dados exige exatamente uma linha no arquivo bruto de cada captura.
    config:
      meta:
        datacontract_cli:
          quality:
            - type: library
              metric: rowCount
              mustBe: 1
    columns:
      - name: data_versao
        description: "{{ doc('data_versao') }} (partição)"
        data_type: date
      - name: feed_publisher_name
        description: "{{ doc('feed_publisher_name') }}"
        data_type: string
      - name: feed_publisher_url
        description: "{{ doc('feed_publisher_url') }}"
        data_type: string
      - name: feed_lang
        description: "{{ doc('feed_lang') }}"
        data_type: string
      - name: default_lang
        description: "{{ doc('default_lang') }}"
        data_type: string
      - name: feed_start_date
        description: "Data inicial do serviço coberto pelo conjunto de dados (YYYYMMDD)"
        data_type: string
      - name: feed_end_date
        description: "Data final do serviço coberto pelo conjunto de dados (YYYYMMDD)"
        data_type: string
      - name: feed_version
        description: "{{ doc('feed_version') }}"
        data_type: string
      - name: feed_contact_email
        description: "{{ doc('feed_contact_email') }}"
        data_type: string
      - name: feed_contact_url
        description: "{{ doc('feed_contact_url') }}"
        data_type: string
      - name: feed_id
        description: "Identificador do conjunto de dados GTFS"
        data_type: string
      - name: timestamp_captura
        description: "{{ doc('timestamp_captura') }}"
        data_type: string

  - name: staging_calendar
    description: |
      Uma linha por service_id por versão do GTFS (data_versao), com os nomes das colunas do arquivo calendar.txt.
      Fonte: capturas do GTFS (source_gtfs.calendar).
    config:
      meta:
        datacontract_cli:
          primaryKey: [data_versao, service_id]
    columns:
      - name: data_versao
        description: "{{ doc('data_versao') }} (partição)"
        data_type: date
      - name: service_id
        description: "{{ doc('service_id') }}"
        data_type: string
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              name: dbt_expectations__expect_column_values_to_match_regex__service_id__staging_calendar
              config:
                description: "Todos os 'service\\_id' começam com 'U\\_', 'S\\_', 'D\\_' ou 'EXCEP'."
                where: "data_versao = '{{ var('data_versao_gtfs') }}'"
              arguments:
                regex: "^([USD]_|EXCEP)"
      - name: monday
        description: "{{ doc('monday') }}"
        data_type: string
      - name: tuesday
        description: "{{ doc('tuesday') }}"
        data_type: string
      - name: wednesday
        description: "{{ doc('wednesday') }}"
        data_type: string
      - name: thursday
        description: "{{ doc('thursday') }}"
        data_type: string
      - name: friday
        description: "{{ doc('friday') }}"
        data_type: string
      - name: saturday
        description: "{{ doc('saturday') }}"
        data_type: string
      - name: sunday
        description: "{{ doc('sunday') }}"
        data_type: string
      - name: start_date
        description: "Dia inicial do intervalo de serviço (YYYYMMDD)"
        data_type: string
      - name: end_date
        description: "Dia final do intervalo de serviço (YYYYMMDD)"
        data_type: string
      - name: timestamp_captura
        description: "{{ doc('timestamp_captura') }}"
        data_type: string

  - name: staging_trips
    description: |
      Uma linha por viagem (trip_id) por versão do GTFS (data_versao), com os nomes das colunas do arquivo trips.txt.
      Fonte: capturas do GTFS (source_gtfs.trips).
    config:
      meta:
        datacontract_cli:
          primaryKey: [trip_id]
    columns:
      - name: data_versao
        description: "{{ doc('data_versao') }} (partição)"
        data_type: date
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_type: string
      - name: service_id
        description: "{{ doc('service_id') }}"
        data_type: string
      - name: trip_id
        description: "{{ doc('trip_id') }}"
        data_type: string
      - name: trip_headsign
        description: "{{ doc('trip_headsign') }}"
        data_type: string
      - name: trip_short_name
        description: "{{ doc('trip_short_name') }}"
        data_type: string
      - name: direction_id
        description: "{{ doc('direction_id') }}"
        data_type: string
      - name: block_id
        description: "{{ doc('block_id') }}"
        data_type: string
      - name: shape_id
        description: "{{ doc('shape_id') }}"
        data_type: string
        data_tests:
          - not_null:
              name: not_null__shape_id__staging_trips
              config:
                description: "Todos os `shape_id` de `trips` estão preenchidos"
                where: "data_versao = '{{ var('data_versao_gtfs') }}'"
          - dbt_utils.relationships_where:
              name: dbt_utils__relationships_where__shape_id__staging_trips
              config:
                description: "Todos os `shape_id` de `trips` constam em `shapes`"
                where: "1=1"
              arguments:
                to: ref('staging_shapes')
                field: shape_id
                from_condition: "data_versao = '{{ var('data_versao_gtfs') }}'"
                to_condition: "data_versao = '{{ var('data_versao_gtfs') }}'"
      - name: wheelchair_accessible
        description: "{{ doc('wheelchair_accessible') }}"
        data_type: string
      - name: bikes_allowed
        description: "{{ doc('bikes_allowed') }}"
        data_type: string
      - name: timestamp_captura
        description: "{{ doc('timestamp_captura') }}"
        data_type: string

  - name: staging_shapes
    description: |
      Uma linha por ponto (shape_id, shape_pt_sequence) por versão do GTFS (data_versao), com os nomes das colunas do arquivo shapes.txt.
      Fonte: capturas do GTFS (source_gtfs.shapes).
    config:
      meta:
        datacontract_cli:
          primaryKey: [shape_id, shape_pt_sequence]
    columns:
      - name: data_versao
        description: "{{ doc('data_versao') }} (partição)"
        data_type: date
      - name: shape_id
        description: "{{ doc('shape_id') }}"
        data_type: string
      - name: shape_pt_lat
        description: "{{ doc('shape_pt_lat') }}"
        data_type: string
      - name: shape_pt_lon
        description: "{{ doc('shape_pt_lon') }}"
        data_type: string
      - name: shape_pt_sequence
        description: "{{ doc('shape_pt_sequence') }}"
        data_type: string
      - name: shape_dist_traveled
        description: "{{ doc('shape_dist_traveled') }}"
        data_type: string
      - name: timestamp_captura
        description: "{{ doc('timestamp_captura') }}"
        data_type: string
