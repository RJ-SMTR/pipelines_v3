version: 2

models:
  - name: agency_gtfs
    description: "Agência de transporte público com serviços representados neste conjunto de dados"
    columns:
      - name: agency_id
        description: "Identifica uma marca de transporte público que geralmente é sinônimo de agência de transporte público"
      - name: agency_name
        description: "Nome completo da agência de transporte público"
      - name: agency_url
        description: "URL da agência de transporte público"
      - name: agency_timezone
        description: "Fuso horário onde a agência de transporte público está localizada"
      - name: agency_lang
        description: "Idioma principal usado por esta agência de transporte público"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: calendar_gtfs
    description: "Datas de serviço especificadas usando uma programação semanal com datas de início e término"
    columns:
      - name: service_id
        description: "{{ doc('service_id') }}"
      - name: monday
        description: "{{ doc('monday') }}"
      - name: tuesday
        description: "{{ doc('tuesday') }}"
      - name: wednesday
        description: "{{ doc('wednesday') }}"
      - name: thursday
        description: "{{ doc('thursday') }}"
      - name: friday
        description: "{{ doc('friday') }}"
      - name: saturday
        description: "{{ doc('saturday') }}"
      - name: sunday
        description: "{{ doc('sunday') }}"
      - name: start_date
        description: "Inicie o dia de serviço para o intervalo de serviço"
      - name: end_date
        description: "Finalize o dia de serviço para o intervalo de serviço"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: calendar_dates_gtfs
    description: "Exceções para os serviços definidos no calendar.txt"
    columns:
      - name: service_id
        description: "Identifica um conjunto de datas quando ocorre uma exceção de serviço para uma ou mais rotas"
      - name: DATE
        description: "Data em que ocorre a exceção de serviço"
      - name: exception_type
        description: "Indica se o serviço está disponível na data especificada no campo de data"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: fare_attributes_gtfs
    description: "Informações sobre tarifas para rotas de uma agência de transporte público"
    columns:
      - name: fare_id
        description: "Identifica uma classe de tarifa"
      - name: price
        description: "Preço da tarifa, na unidade especificada por currency_type"
      - name: currency_type
        description: "Moeda usada para pagar a tarifa"
      - name: payment_method
        description: "Indica quando a tarifa deve ser paga"
      - name: transfers
        description: "Indica o número de transferências permitidas nesta tarifa"
      - name: agency_id
        description: "Identifica a agência relevante para uma tarifa"
      - name: transfer_duration
        description: "Período de tempo em segundos antes que uma transferência expire"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: fare_rules_gtfs
    description: "Regras para aplicação de tarifas de itinerários"
    columns:
      - name: fare_id
        description: "Identifica uma classe de tarifa"
      - name: route_id
        description: "{{ doc('route_id') }} associada à classe de tarifa"
      - name: origin_id
        description: "Identifica uma zona de origem"
      - name: destination_id
        description: "Identifica uma zona de destino"
      - name: contains_id
        description: "Identifica as zonas nas quais um passageiro entrará ao usar uma determinada classe de tarifa"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: feed_info_gtfs
    description: "Metadados do conjunto de dados, incluindo informações sobre editor, versão e expiração"
    columns:
      - name: feed_publisher_name
        description: "{{ doc('feed_publisher_name') }}"
      - name: feed_publisher_url
        description: "{{ doc('feed_publisher_url') }}"
      - name: feed_lang
        description: "{{ doc('feed_lang') }}"
      - name: default_lang
        description: "{{ doc('default_lang') }}"
      - name: feed_start_date
        description: "O conjunto de dados fornece informações de programação completas e confiáveis ​​para serviço no período que vai do início do dia feed_start_date até o final do dia feed_end_date"
        tests:
          - unique:
              name: unique__feed_start_date__feed_info_gtfs
              config:
                where: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: feed_contact_email
        description: "{{ doc('feed_contact_email') }}"
      - name: feed_contact_url
        description: "{{ doc('feed_contact_url') }}"
      - name: feed_update_datetime
        description: "Data e hora da última atualização do feed"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: frequencies_gtfs
    description: "Intervalo [tempo entre viagens] para serviço baseado em intervalo ou uma representação compactada de serviço com horário fixo"
    columns:
      - name: trip_id
        description: "{{ doc('trip_id') }}"
      - name: start_time
        description: "{{ doc('start_time') }}"
      - name: end_time
        description: "{{ doc('end_time') }}"
      - name: headway_secs
        description: "{{ doc('headway_secs') }}"
      - name: exact_times
        description: "{{ doc('exact_times') }}"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: routes_gtfs
    description: "Rotas de trânsito. Uma rota é um grupo de viagens exibidas aos passageiros como um único serviço"
    columns:
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: agency_id
        description: "{{ doc('agency_id') }}"
      - name: route_short_name
        description: "{{ doc('route_short_name') }}"
      - name: route_long_name
        description: "{{ doc('route_long_name') }}"
      - name: route_desc
        description: "{{ doc('route_desc') }}"
      - name: route_type
        description: "{{ doc('route_type') }}"
      - name: route_url
        description: "{{ doc('route_url') }}"
      - name: route_color
        description: "{{ doc('route_color') }}"
      - name: route_text_color
        description: "{{ doc('route_text_color') }}"
      - name: route_sort_order
        description: "{{ doc('route_sort_order') }}"
      - name: continuous_pickup
        description: "{{ doc('continuous_pickup_route') }}"
      - name: continuous_drop_off
        description: "{{ doc('continuous_drop_off_route') }}"
      - name: network_id
        description: "{{ doc('network_id') }}"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: shapes_geom_gtfs
    description: "Shapes em formatos geográficos dos serviços"
    columns:
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: shape_id
        description: "{{ doc('shape_id') }}"
      - name: shape
        description: "{{ doc('shape') }}"
      - name: shape_distance
        description: "{{ doc('shape_distance') }}"
      - name: start_pt
        description: "{{ doc('start_pt') }}"
      - name: end_pt
        description: "{{ doc('end_pt') }}"
      - name: data_versao
        description: "{{ doc('data_versao') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: shapes_gtfs
    description: "Regras para mapear caminhos de deslocamento de veículos, às vezes chamados de alinhamentos de rotas"
    columns:
      - name: shape_id
        description: "{{ doc('shape_id') }}"
      - name: shape_pt_sequence
        description: "{{ doc('shape_pt_sequence') }}"
      - name: shape_pt_lat
        description: "{{ doc('shape_pt_lat') }}"
      - name: shape_pt_lon
        description: "{{ doc('shape_pt_lon') }}"
      - name: shape_dist_traveled
        description: "{{ doc('shape_dist_traveled') }}"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: stops_gtfs
    description: "Paradas onde os veículos pegam ou deixam os passageiros [também define estações e entradas de estação]"
    columns:
      - name: stop_id
        description: "{{ doc('stop_id') }}"
      - name: stop_code
        description: "{{ doc('stop_code') }}"
      - name: stop_name
        description: "{{ doc('stop_name') }}"
      - name: tts_stop_name
        description: "{{ doc('tts_stop_name') }}"
      - name: stop_desc
        description: "{{ doc('stop_desc') }}"
      - name: stop_lat
        description: "{{ doc('stop_lat') }}"
      - name: stop_lon
        description: "{{ doc('stop_lon') }}"
      - name: zone_id
        description: "{{ doc('zone_id') }}"
      - name: stop_url
        description: "{{ doc('stop_url') }}"
      - name: location_type
        description: "{{ doc('location_type') }}"
      - name: parent_station
        description: "{{ doc('parent_station') }}"
      - name: stop_timezone
        description: "{{ doc('stop_timezone') }}"
      - name: wheelchair_boarding
        description: "{{ doc('wheelchair_boarding') }}"
      - name: level_id
        description: "{{ doc('level_id') }}"
      - name: platform_code
        description: "{{ doc('platform_code') }}"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: stop_times_gtfs
    description: "Horários em que um veículo chega e sai das paradas de cada viagem"
    columns:
      - name: trip_id
        description: "{{ doc('trip_id') }}"
      - name: stop_sequence
        description: "{{ doc('stop_sequence') }}"
      - name: stop_id
        description: "{{ doc('stop_id_stop_time') }}"
      - name: arrival_time
        description: "{{ doc('arrival_time') }}"
      - name: departure_time
        description: "{{ doc('departure_time') }}"
      - name: stop_headsign
        description: "{{ doc('trip_headsign') }}"
      - name: pickup_type
        description: "{{ doc('pickup_type') }}"
      - name: drop_off_type
        description: "{{ doc('drop_off_type') }}"
      - name: continuous_pickup
        description: "{{ doc('continuous_pickup_stop_time') }}"
      - name: continuous_drop_off
        description: "{{ doc('continuous_drop_off_stop_time') }}"
      - name: shape_dist_traveled
        description: "{{ doc('shape_dist_traveled_stop_time') }}"
      - name: timepoint
        description: "{{ doc('timepoint') }}"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: trips_gtfs
    description: "Viagens para cada rota"
    columns:
      - name: trip_id
        description: "{{ doc('trip_id') }}"
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: service_id
        description: "{{ doc('service_id') }}"
      - name: trip_headsign
        description: "{{ doc('trip_headsign') }}"
      - name: trip_short_name
        description: "{{ doc('trip_short_name') }}"
      - name: direction_id
        description: "{{ doc('direction_id') }}"
      - name: block_id
        description: "{{ doc('block_id') }}"
      - name: shape_id
        description: "{{ doc('shape_id') }}"
      - name: wheelchair_accessible
        description: "{{ doc('wheelchair_accessible') }}"
      - name: bikes_allowed
        description: "{{ doc('bikes_allowed') }}"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"

  - name: ordem_servico_gtfs
    description: "Dados das linhas presentes no município"
    columns:
      - name: servico
        description: "{{ doc('servico') }} de ônibus"
      - name: vista
        description: "{{ doc('vista') }}"
      - name: consorcio
        description: "Nome do consórcio responsável pela linha"
      - name: horario_inicio
        description: "{{ doc('horario_inicio') }}"
      - name: horario_fim
        description: "Horário da última viagem"
      - name: extensao_ida
        description: "{{ doc('extensao_ida') }}"
      - name: extensao_volta
        description: "{{ doc('extensao_volta') }}"
      - name: partidas_ida
        description: "Quantidade de partidas no sentido ida"
      - name: partidas_volta
        description: "{{ doc('partidas_volta') }}"
      - name: viagens_planejadas
        description: "Quantidade de viagens realizadas"
      - name: distancia_total_planejada
        description: "{{ doc('distancia_total_planejada') }}"
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"

  - name: ordem_servico_trajeto_alternativo_gtfs
    description: "Anexo da Ordem de Serviço [OS] com trajetos alternativos de serviços"
    tests:
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          name: dbt_expectations__expect_table_aggregation_to_equal_other_table__ordem_servico_trajeto_alternativo_gtfs
          config:
            description: "Todos os dados de 'feed_start_date' e 'tipo_os' correspondem 1:1 entre as tabelas 'ordem_servico_trajeto_alternativo_gtfs' e 'ordem_servico_gtfs'."
            where: "1=1"
          arguments:
            expression: count(distinct tipo_os)
            compare_model: ref("ordem_servico_faixa_horaria") if var('data_versao_gtfs') < var('DATA_GTFS_V4_INICIO') else ref("ordem_servico_faixa_horaria_sentido")
            compare_expression: count(distinct tipo_os)
            group_by: [feed_start_date, tipo_os]
            compare_group_by: [feed_start_date, tipo_os]
            row_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}' and feed_start_date < '{{ var('DATA_GTFS_V5_INICIO') }}'"
            compare_row_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}' and feed_start_date < '{{ var('DATA_GTFS_V5_INICIO') }}'"
    columns:
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: servico
        description: "{{ doc('servico_variacao') }}"
      - name: consorcio
        description: "{{ doc('consorcio') }}"
      - name: vista
        description: "{{ doc('vista') }}"
      - name: ativacao
        description: "{{ doc('ativacao_trajeto_alternativo') }}"
      - name: descricao
        description: "Descriação sobre o trajeto alternativo"
      - name: evento
        description: "{{ doc('evento_trajeto_alternativo') }}"
      - name: extensao_ida
        description: "Distância planejada de ida do trajeto alternativo (km)"
      - name: extensao_volta
        description: "Distância planejada de volta do trajeto alternativo (km)"
      - name: inicio_periodo
        description: "{{ doc('horario_inicio') }} do trajeto alternativo"
      - name: fim_periodo
        description: "Horário final de funcionamento do trajeto alternativo"
      - name: versao_modelo
        description: "{{ doc('versao') }}"
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
  - name: ordem_servico_trips_shapes_gtfs
    description: "Junção da Ordem de Serviço [OS] com trips e shapes dos serviços"
    tests:
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          name: dbt_expectations__expect_table_aggregation_to_equal_other_table__ordem_servico_trips_shapes_gtfs
          config:
            description: "Todos os dados de 'feed_start_date', 'tipo_os', 'tipo_dia', 'servico' e 'faixa_horaria_inicio' correspondem 1:1 entre as tabelas 'ordem_servico_trips_shapes_gtfs' e 'ordem_servico_faixa_horaria'."
            where: "1=1"
          arguments:
            expression: count(distinct feed_start_date)
            compare_model: ref("ordem_servico_faixa_horaria") if var('data_versao_gtfs') < var('DATA_GTFS_V4_INICIO') else ref("ordem_servico_faixa_horaria_sentido")
            compare_expression: count(distinct feed_start_date)
            group_by:
              [
                feed_start_date,
                tipo_os,
                tipo_dia,
                servico,
                faixa_horaria_inicio,
              ]
            compare_group_by:
              [
                feed_start_date,
                tipo_os,
                tipo_dia,
                servico,
                faixa_horaria_inicio,
              ]
            row_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
            compare_row_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}' AND (quilometragem != 0 AND (partidas != 0 OR partidas IS NULL))"
      - dbt_utils.unique_combination_of_columns:
          name: dbt_utils__unique_combination_of_columns__ordem_servico_trips_shapes_gtfs
          config:
            description: "Todos os dados de 'feed_start_date', 'tipo_dia', 'tipo_os', 'servico', 'sentido', 'faixa_horaria_inicio' e 'shape_id' são únicos."
            where: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
          arguments:
            combination_of_columns:
              - feed_start_date
              - tipo_dia
              - tipo_os
              - servico
              - sentido
              - faixa_horaria_inicio
              - shape_id
      - dbt_expectations.expect_table_row_count_to_be_between:
          name: dbt_expectations__expect_table_row_count_to_be_between__ordem_servico_trips_shapes_gtfs
          config:
            description: "A quantidade de registros de 'feed_start_date', 'tipo_dia', 'tipo_os', 'servico', 'faixa_horaria_inicio' e 'shape_id' está dentro do intervalo esperado."
            where: "1=1"
          arguments:
            min_value: 1
            max_value: 2
            group_by:
              [
                feed_start_date,
                tipo_dia,
                tipo_os,
                servico,
                faixa_horaria_inicio,
                shape_id,
              ]
            row_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
            strictly: false
    columns:
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
      - name: servico
        description: "{{ doc('servico_variacao') }}"
      - name: vista
        description: "{{ doc('vista') }}"
      - name: consorcio
        description: "{{ doc('consorcio') }}"
      - name: sentido
        description: "{{ doc('sentido') }}"
      - name: partidas_total_planejada
        description: "{{ doc('partidas') }}"
      - name: distancia_planejada
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              name: dbt_expectations__expect_column_values_to_be_between__distancia_planejada__ordem_servico_trips_shapes_gtfs
              config:
                description: "Todos os valores de 'distancia_planejada' são maiores que zero"
                where: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
              arguments:
                min_value: 1
        description: "Distância planejada de uma viagem do serviço (km)"
      - name: distancia_total_planejada
        description: "{{ doc('distancia_total_planejada') }}"
      - name: inicio_periodo
        description: "{{ doc('horario_inicio') }}"
      - name: fim_periodo
        description: "Horário da final de funcionamento do serviço"
      - name: faixa_horaria_inicio
        description: "{{ doc('faixa_horaria_inicio') }}"
      - name: faixa_horaria_fim
        description: "{{ doc('faixa_horaria_fim') }}"
      - name: trip_id_planejado
        description: "{{ doc('trip_id') }}"
      - name: trip_id
        description: "{{ doc('trip_id') }} com ajustes"
      - name: shape_id
        description: "{{ doc('shape_id') }}"
      - name: shape_id_planejado
        description: "{{ doc('shape_id_planejado') }}"
      - name: shape
        description: "{{ doc('shape') }}"
      - name: sentido_shape
        description: "{{ doc('sentido_shape') }}"
      - name: start_pt
        description: "{{ doc('start_pt') }}"
      - name: end_pt
        description: "{{ doc('end_pt') }}"
      - name: id_tipo_trajeto
        description: "Tipo de trajeto (0 - Regular, 1 - Alternativo)"
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
