version: 2

models:
  - name: aux_calendario_manual
    description: >
      Uma linha por data com alguma modificação manual do calendário operacional. Mantém o
      histórico das regras aplicadas, não sendo um snapshot do estado atual. Use `data` como
      chave de join com os modelos de calendário e planejamento; não há exceções de
      granularidade. Fonte: regras históricas congeladas no próprio modelo antes de var('data_inicio_calendario_sheets')
      e `source_smtr.calendario_manual` a partir dessa data. Datas sem `feed_start_date`,
      `tipo_dia`, `subtipo_dia` ou `tipo_os` são excluídas.
    columns:
      - name: data
        description: "Data do dia atípico"
        data_type: date
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
        data_type: date
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
        data_type: string
      - name: subtipo_dia
        description: "{{ doc('subtipo_dia') }}"
        data_type: string
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
        data_type: string

  - name: staging_ordem_servico_trajeto_alternativo_sentido
    description: |
      Uma linha por serviço, sentido, tipo de OS e evento por versão do GTFS (data_versao), com os nomes das colunas do arquivo bruto do anexo de trajetos alternativos da OS.
      Fonte: capturas do GTFS (source_gtfs.ordem_servico_trajeto_alternativo_sentido).
    config:
      meta:
        datacontract_cli:
          primaryKey: [data_versao, servico, sentido, tipo_os, evento]
    columns:
      - name: data_versao
        description: "{{ doc('data_versao') }} (partição)"
        data_type: date
      - name: servico
        description: "{{ doc('servico_variacao') }}"
        data_type: string
        data_tests:
          - dbt_utils.relationships_where:
              name: dbt_utils__relationships_where__servico__staging_ordem_servico_trajeto_alternativo_sentido
              config:
                description: "Todos os serviços de `ordem_servico_trajeto_alternativo_sentido` constam em `ordem_servico_faixa_horaria_sentido`"
                where: "1=1"
              arguments:
                to: ref('staging_ordem_servico_faixa_horaria_sentido')
                field: servico
                from_condition: "data_versao = '{{ var('data_versao_gtfs') }}'"
                to_condition: "data_versao = '{{ var('data_versao_gtfs') }}'"
      - name: consorcio
        description: "{{ doc('consorcio') }}"
        data_type: string
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
        data_type: string
        data_tests:
          - dbt_utils.relationships_where:
              name: dbt_utils__relationships_where__tipo_os__staging_ordem_servico_trajeto_alternativo_sentido
              config:
                description: "Todos os `tipo_os` de `ordem_servico_trajeto_alternativo_sentido` constam em `ordem_servico_faixa_horaria_sentido`"
                where: "1=1"
              arguments:
                to: ref('staging_ordem_servico_faixa_horaria_sentido')
                field: tipo_os
                from_condition: "data_versao = '{{ var('data_versao_gtfs') }}'"
                to_condition: "data_versao = '{{ var('data_versao_gtfs') }}'"
      - name: vista
        description: "{{ doc('vista') }}"
        data_type: string
      - name: sentido
        description: "{{ doc('sentido') }}"
        data_type: string
      - name: extensao
        description: "{{ doc('extensao') }}"
        data_type: string
      - name: evento
        description: "{{ doc('evento_trajeto_alternativo') }}"
        data_type: string
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              name: dbt_expectations__expect_column_values_to_match_regex__evento__staging_ordem_servico_trajeto_alternativo_sentido
              config:
                description: "Todos os valores de `evento` em `staging_ordem_servico_trajeto_alternativo_sentido` estão no formato `[a-z0-9_]`, entre colchetes (sem acentos ou caracteres especiais)."
                where: "data_versao = '{{ var('data_versao_gtfs') }}'"
              arguments:
                regex: '^\[[a-z0-9_]+\]$'
                is_raw: true
      - name: descricao
        description: "{{ doc('descricao_trajeto_alternativo') }}"
        data_type: string
      - name: ativacao
        description: "{{ doc('ativacao_trajeto_alternativo') }}"
        data_type: string
      - name: timestamp_captura
        description: "{{ doc('timestamp_captura') }}"
        data_type: string

