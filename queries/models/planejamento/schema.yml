version: 2

models:
  - name: ordem_servico_faixa_horaria
    description: "Quantidade de viagens planejadas por faixa horária"
    tests:
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          name: dbt_expectations__expect_table_aggregation_to_equal_other_table__ordem_servico_faixa_horaria
          config:
            where: "feed_start_date < date('{DATA_GTFS_V2_INICIO}')"
          arguments:
            expression: count(distinct tipo_os)
            compare_model: ref("ordem_servico_gtfs")
            compare_expression: count(distinct tipo_os)
            group_by: [feed_start_date, tipo_os]
            compare_group_by: [feed_start_date, tipo_os]
            row_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
            compare_row_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
    columns:
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
      - name: servico
        description: "{{ doc('servico') }}"
      - name: vista
        description: "{{ doc('vista') }}"
      - name: consorcio
        description: "{{ doc('consorcio') }}"
      - name: extensao_ida
        description: "Distância percorrida na ida"
      - name: extensao_volta
        description: "Distância percorrida na volta"
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
      - name: horario_inicio
        description: "{{ doc('horario_inicio') }}"
      - name: horario_fim
        description: "Horário da última viagem"
      - name: partidas_ida_dia
        description: "Quantidade de partidas no sentido ida"
      - name: partidas_volta_dia
        description: "Quantidade de partidas no sentido volta"
      - name: viagens_dia
        description: "Quantidade de viagens planejadas no dia"
      - name: faixa_horaria_inicio
        description: "{{ doc('faixa_horaria_inicio') }}"
      - name: faixa_horaria_fim
        description: "{{ doc('faixa_horaria_fim') }}"
      - name: partidas
        description: "{{ doc('partidas') }}"
        # tests:
        #   - dbt_expectations.expect_column_sum_to_be_between:
        #       name: dbt_expectations__expect_column_sum_to_be_between__partidas__ordem_servico_faixa_horaria
        #       min_value: 0
        #       group_by: [ feed_start_date, tipo_os, tipo_dia, servico ]
        #       strictly: true
        #       where: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
      - name: quilometragem
        description: "{{ doc('quilometragem') }}"
        # tests:
        #   - dbt_expectations.expect_column_sum_to_be_between:
        #       name: dbt_expectations__expect_column_sum_to_be_between__quilometragem__ordem_servico_faixa_horaria
        #       min_value: 0
        #       group_by: [ feed_start_date, tipo_os, tipo_dia, servico ]
        #       strictly: true
        #       where: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
      - name: versao
        description: "{{ doc('versao') }}"
  - name: segmento_shape
    description: Tabela contendo os shapes segmentados usados na validação de viagens.
    columns:
      - name: feed_version
        description: "{{ doc('feed_version') }}"
        data_type: string
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
        data_type: date
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
        data_type: date
      - name: shape_id
        description: Identificador de shape.
        data_type: string
      - name: id_segmento
        description: Identificador do segmento.
        data_type: string
      - name: segmento
        description: Segmento em formato geográfico.
        data_type: geography
      - name: wkt_segmento
        description: Segmento em formato string WKT
        data_type: string
      - name: comprimento_segmento
        description: Comprimento do segmento emm metros.
        data_type: float64
      - name: buffer_completo
        description: Área de 20m ao redor do segmento.
        data_type: geography
      - name: buffer
        description: Área de 20m ao redor do segmento com tratamento para não haver interseções entre ele e os segmentos posteriores.
        data_type: geography
      - name: inicio_vigencia_tunel
        description: "{{ doc('inicio_vigencia_tunel') }}"
        data_type: date
      - name: fim_vigencia_tunel
        description: "{{ doc('fim_vigencia_tunel') }}"
        data_type: date
      - name: indicador_tunel
        description: Indica se o segmento passa por um túnel.
        data_type: boolean
      - name: indicador_area_prejudicada
        description: Indica se o buffer teve a área reduzida em mais de 50% após o tratamento.
        data_type: boolean
      - name: indicador_segmento_pequeno
        description: Indica se o segmento é menor que 990 metros.
        data_type: boolean
      - name: indicador_segmento_desconsiderado
        description: Indica se o segmento deve ser desconsiderado na validação de viagens
        data_type: boolean
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
  - name: shapes_geom_planejamento
    description: Tabela contendo shapes em formatos geográficos
    columns:
      - name: feed_version
        description: "{{ doc('feed_version') }}"
        data_type: string
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
        data_type: date
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
        data_type: date
      - name: shape_id
        description: Identificador de shape.
        data_type: string
      - name: shape
        description: "{{ doc('shape') }}"
        data_type: geography
      - name: wkt_shape
        description: Shape em formato string WKT
        data_type: string
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
      - name: start_pt
        description: Primeiro ponto do shape
        data_type: geography
      - name: end_pt
        description: Último ponto do shape
        data_type: geography
  - name: viagem_planejada_planejamento
    description: Quadro horário de viagens planejadas por tipo de dia, com base no GTFS
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: dbt_utils__unique_combination_of_columns__viagem_planejada_planejamento
          config:
            where: "feed_start_date = '{{ var('data_versao_gtfs') }}'"
          arguments:
            combination_of_columns:
              - feed_start_date
              - id_viagem
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          name: dbt_expectations__expect_table_aggregation_to_equal_other_table__trajetos_alternativos__viagem_planejada_planejamento
          config:
            where: "feed_start_date = '{{ var('data_versao_gtfs') }}' and feed_start_date >= date('{{ var('DATA_GTFS_V5_INICIO') }}')"
          arguments:
            expression: "any_value((select count(distinct trajeto.evento) from unnest(trajetos_alternativos) as trajeto))"
            compare_model: ref("ordem_servico_trajeto_alternativo_sentido")
            compare_expression: count(distinct evento)
            group_by:
              - feed_start_date
              - servico
              - tipo_os
              - if(sentido = 'V', 'V', 'I')
            compare_group_by:
              - feed_start_date
              - servico
              - tipo_os
              - if(left(sentido, 1) = 'V', 'V', 'I')
            row_condition: "1=1"
            compare_row_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}' and feed_start_date >= date('{{ var('DATA_GTFS_V5_INICIO') }}')"
      - planejamento_gtfs_freshness:
          name: planejamento_gtfs_freshness__viagem_planejada_planejamento
          arguments:
            partition_column: feed_start_date
            model_relation: ref("viagem_planejada_planejamento")
          config:
            where: "1=1"
            tags: ["freshness", "daily"]
            severity: warn
    columns:
      - name: id_viagem
        description: "{{ doc('id_viagem') }}"
        data_type: string
      - name: horario_partida
        description: "Horário de partida da viagem no formato HH:MM:SS"
        data_type: string
      - name: modo
        description: "{{ doc('modo') }}"
        data_type: string
      - name: consorcio
        description: "{{ doc('consorcio') }}"
        data_type: string
      - name: sistema
        description: "{{ doc('sistema') }}"
        data_type: string
      - name: vista
        description: "{{ doc('vista') }}"
        data_type: string
      - name: service_id
        description: Identifica um conjunto de datas em que o serviço está disponível para uma ou mais rotas
        data_type: string
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
        data_type: string
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
        data_type: string
      - name: trip_id
        description: "{{ doc('trip_id') }}"
        data_type: string
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_type: string
      - name: shape_id
        description: Identificador de um shape da tabela shapes do GTFS
        data_type: string
      - name: servico
        description: "{{ doc('servico') }}"
        data_type: string
      - name: sentido
        description: "{{ doc('sentido') }}"
        data_type: string
      - name: extensao
        description: "{{ doc('extensao') }}"
        data_type: float64
      - name: trajetos_alternativos
        description: "{{ doc('trajetos_alternativos') }}"
        data_type: record
      - name: feed_start_date
        description: "Data inicial do feed do GTFS (versão). [partição]"
        data_type: date
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
        data_type: datetime
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
        data_type: string
  - name: viagem_planejada_planejamento_dia
    description: Uma linha por viagem planejada por dia. Representa o planejamento derivado do GTFS e do calendário operacional para a janela de materialização, incluindo extensão de 2 dias além de `date_range_end`. Use `(data, id_viagem)` como chave de join; a seleção considera o calendário e os feeds GTFS disponíveis para o período.
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: dbt_utils__unique_combination_of_columns__viagem_planejada_planejamento_dia
          config:
            where: "data between date('{date_range_start}') and date_add(date('{date_range_end}'), interval 2 day)"
          arguments:
            combination_of_columns:
              - data
              - id_viagem
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          name: dbt_expectations__expect_table_aggregation_to_equal_other_table__trajetos_alternativos__viagem_planejada_planejamento_dia
          config:
            where: "data between date('{date_range_start}') and date_add(date('{date_range_end}'), interval 2 day) and feed_start_date >= date('{{ var('DATA_GTFS_V5_INICIO') }}')"
          arguments:
            expression: "any_value((select count(distinct trajeto.evento) from unnest(trajetos_alternativos) as trajeto))"
            compare_model: ref("ordem_servico_trajeto_alternativo_sentido")
            compare_expression: count(distinct evento)
            group_by:
              - feed_start_date
              - servico
              - tipo_os
              - if(sentido = 'V', 'V', 'I')
            compare_group_by:
              - feed_start_date
              - servico
              - tipo_os
              - if(left(sentido, 1) = 'V', 'V', 'I')
            row_condition: "1=1"
            compare_row_condition: >
              feed_start_date in (
                select distinct feed_start_date
                from {{ ref("viagem_planejada_planejamento_dia") }}
                where
                  data between date('{{ var("date_range_start") }}')
                  and date_add(
                    date('{{ var("date_range_end") }}'),
                    interval 2 day
                  )
              )
              and feed_start_date >= date('{{ var("DATA_GTFS_V5_INICIO") }}')
      - planejamento_gtfs_freshness:
          name: planejamento_gtfs_freshness__viagem_planejada_planejamento_dia
          arguments:
            partition_column: data
            model_relation: ref("viagem_planejada_planejamento_dia")
          config:
            where: "1=1"
            tags: ["freshness", "daily"]
            severity: warn
    columns:
      - name: data
        description: "{{ doc('data_viagem') }} [partição]"
        data_type: date
      - name: id_viagem
        description: "{{ doc('id_viagem') }}"
        data_type: string
      - name: datetime_partida
        description: "{{ doc('datetime_partida') }}"
        data_type: datetime
      - name: modo
        description: "{{ doc('modo') }}"
        data_type: string
      - name: consorcio
        description: "{{ doc('consorcio') }}"
        data_type: string
      - name: sistema
        description: "{{ doc('sistema') }}"
        data_type: string
      - name: vista
        description: "{{ doc('vista') }}"
        data_type: string
      - name: service_id
        description: Identifica um conjunto de datas em que o serviço está disponível para uma ou mais rotas
        data_type: string
      - name: trip_id
        description: "{{ doc('trip_id') }}"
        data_type: string
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_type: string
      - name: shape_id
        description: Identificador de um shape da tabela shapes do GTFS
        data_type: string
      - name: servico
        description: "{{ doc('servico') }}"
        data_type: string
      - name: sentido
        description: "{{ doc('sentido') }}"
        data_type: string
      - name: extensao
        description: Distância planejada da viagem, conforme Ordem de Serviço (OS)
        data_type: float64
      - name: trajetos_alternativos
        description: "{{ doc('trajetos_alternativos') }}"
        data_type: record
      - name: data_referencia
        description: Data de referência que foi utilizada de base para gerar a viagem
        data_type: date
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
        data_type: string
      - name: subtipo_dia
        description: "{{ doc('subtipo_dia') }}"
        data_type: string
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
        data_type: string
      - name: feed_start_date
        description: Data inicial do feed do GTFS (versão).
        data_type: date
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
        data_type: datetime
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
        data_type: string
  - name: calendario
    description: Tabela calendário
    columns:
      - name: data
        description: "{{ doc('data') }}"
        data_type: date
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
        data_type: string
      - name: subtipo_dia
        description: "{{ doc('subtipo_dia') }}"
        data_type: string
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
        data_type: string
      - name: service_ids
        description: Lista de service_ids válidos para o dia
        data_type: string
      - name: feed_version
        description: "{{ doc('feed_version') }}"
        data_type: string
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
        data_type: date
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
        data_type: datetime
  - name: matriz_integracao
    description: "Matriz de integração no sistema de transporte municipal"
    columns:
      - name: tempo_integracao_minutos
        description: "{{ doc('tempo_integracao_minutos_matriz') }}"
        data_type: float64
      - name: data_inicio
        description: Data de início da validade da integração [partição]
        data_type: date
      - name: data_fim
        description: Data de fim da validade da integração
        data_type: date
      - name: integracao
        description: String representando a integração (sequência modos da integração separados por "-"). Pode ser usada como chave para relacionar com a tabela rj-smtr.planejamento.matriz_reparticao_tarifaria
        data_type: string
      - name: modo_origem
        description: Modo da perna de origem
        data_type: string
      - name: id_servico_jae_origem
        description: Identificador único do serviço da perna de origem no banco de dados da Jaé
        data_type: string
      - name: id_servico_gtfs_origem
        description: Identificador único do serviço da perna de origem no GTFS
        data_type: string
      - name: tabela_gtfs_origem
        description: Tabela do GTFS de onde foram coletadas as informações do serviço da perna de origem (stops ou routes)
        data_type: string
      - name: servico_origem
        description: "Nome consolidado do serviço da perna de origem. Para linhas, é o nome curto da linha (ex: 010, 011SN). E para estações, é o stop_code do GTFS ou o código interno da estação no banco de dados da Jaé"
        data_type: string
      - name: descricao_servico_origem
        description: Nome completo consolidado do serviço da perna de origem. Para linhas é, primariamente o route_long_name da tabela routes do GTFS. Para estações é primariamente a coluna stop_name da tabela stops do GTFS. (Caso o registro não exista no GTFS, busca o nome do serviço na base de dados da Jaé)
        data_type: string
      - name: integracao_origem
        description: Sequência de modos separados por "-" (caso a integração tenha mais de 2 pernas)
        data_type: string
      - name: modo_destino
        description: Modo da perna de destino
        data_type: string
      - name: id_servico_jae_destino
        description: Identificador único do serviço da perna de destino no banco de dados da Jaé
        data_type: string
      - name: id_servico_gtfs_destino
        description: Identificador único do serviço da perna de destino no GTFS
        data_type: string
      - name: tabela_gtfs_destino
        description: Tabela do GTFS de onde foram coletadas as informações do serviço da perna de destino (stops ou routes)
        data_type: string
      - name: servico_destino
        description: "Nome consolidado do serviço da perna de destino. Para linhas, é o nome curto da linha (ex: 010, 011SN). E para estações, é o stop_code do GTFS ou o código interno da estação no banco de dados da Jaé"
        data_type: string
      - name: descricao_servico_destino
        description: Nome completo consolidado do serviço da perna de origem. Para linhas é, primariamente o route_long_name da tabela routes do GTFS. Para estações é primariamente a coluna stop_name da tabela stops do GTFS. (Caso o registro não exista no GTFS, busca o nome do serviço na base de dados da Jaé)
        data_type: string
      - name: valor_integracao
        description: Valor total da integração (R$)
        data_type: numeric
      - name: tipo_integracao
        description: Integração ou Transferência
        data_type: string
      - name: indicador_integracao
        description: Se deve ocorrer a integração ou não para a combinação de origem e destino
        data_type: boolean
  - name: tecnologia_servico
    description: "Tabela auxiliar de tecnologias permitidas por serviço"
    tests:
      - dbt_utils.unique_combination_of_columns:
          name: dbt_utils__unique_combination_of_columns__tecnologia_servico
          config:
            where: "1=1"
          arguments:
            combination_of_columns:
              - inicio_vigencia
              - servico
    columns:
      - name: inicio_vigencia
        description: "Data de inicio da vigência"
        data_type: date
        tests:
          - not_null:
              name: not_null__inicio_vigencia__tecnologia_servico
              config:
                where: "1=1"
      - name: fim_vigencia
        description: "Data de fim da vigência"
        data_type: date
      - name: servico
        description: "{{ doc('servico') }}"
        data_type: string
      - name: modo
        description: "{{ doc('modo') }}"
        data_type: string
      - name: codigo_tecnologia
        description: "Código binário onde cada caractere representa uma tecnologia"
        data_type: string
        tests:
          - not_null:
              name: not_null__codigo_tecnologia__tecnologia_servico
              config:
                where: "1=1"
      - name: maior_tecnologia_permitida
        description: "Maior tipo de tecnologia permitida para o veículo"
        data_type: string
        tests:
          - not_null_for_planned_services:
              name: not_null__maior_tecnologia_permitida__tecnologia_servico
              config:
                where: "inicio_vigencia <= date('{{ var('date_range_end') }}') and (fim_vigencia is null OR fim_vigencia >= date('{{ var('date_range_start') }}'))"
      - name: menor_tecnologia_permitida
        description: "Menor tipo de tecnologia permitida para o veículo"
        data_type: string
        tests:
          - not_null_for_planned_services:
              name: not_null__menor_tecnologia_permitida__tecnologia_servico
              config:
                where: "inicio_vigencia <= date('{{ var('date_range_end') }}') and (fim_vigencia is null OR fim_vigencia >= date('{{ var('date_range_start') }}'))"
  - name: servico_planejado_faixa_horaria
    description: "Serviços planejados por data, faixa horária e sentido com informações de viagens"
    columns:
      - name: data
        description: "Data [partição]"
        data_type: date
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
        data_type: date
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
        data_type: string
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
        data_type: string
      - name: servico
        description: "{{ doc('servico') }}"
        data_type: string
      - name: consorcio
        description: "{{ doc('consorcio') }}"
        data_type: string
      - name: sistema
        description: "{{ doc('sistema') }}"
        data_type: string
      - name: vista
        description: "{{ doc('vista') }}"
        data_type: string
      - name: sentido
        description: "{{ doc('sentido') }}"
        data_type: string
      - name: extensao
        description: "{{ doc('extensao') }}"
        data_type: float64
      - name: partidas
        description: "{{ doc('partidas') }}"
        data_type: int64
      - name: quilometragem
        description: "{{ doc('quilometragem') }}"
        data_type: float64
      - name: faixa_horaria_inicio
        description: "{{ doc('faixa_horaria_inicio') }}"
        data_type: datetime
      - name: faixa_horaria_fim
        description: "{{ doc('faixa_horaria_fim') }}"
        data_type: datetime
      - name: modo
        description: "{{ doc('modo') }}"
        data_type: string
      - name: trip_info
        description: "Informações detalhadas das viagens programadas na faixa horária"
        data_type: record
      - name: trajetos_alternativos
        description: "{{ doc('trajetos_alternativos') }}"
        data_type: record
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
        data_type: datetime
  - name: matriz_reparticao_tarifaria
    description: Matriz de repartição tarifária de integrações válidas no sistema de transporte municipal
