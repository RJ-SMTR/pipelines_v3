  - name: ordem_servico_trajeto_alternativo_sentido
    description: "Anexo da Ordem de Serviço [OS] com trajetos alternativos de serviços"
    tests:
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          name: dbt_expectations__expect_table_aggregation_to_equal_other_table__ordem_servico_trajeto_alternativo_sentido
          config:
            where: "feed_start_date >= date('{{ var('DATA_GTFS_V5_INICIO') }}')"
          arguments:
            expression: count(distinct tipo_os)
            compare_model: ref("ordem_servico_faixa_horaria_sentido")
            compare_expression: count(distinct tipo_os)
            group_by: [feed_start_date, tipo_os]
            compare_group_by: [feed_start_date, tipo_os]
            row_condition: "feed_start_date = greatest('{{ var('data_versao_gtfs') }}', date('{{ var('DATA_GTFS_V5_INICIO') }}'))"
            compare_row_condition: "feed_start_date = greatest('{{ var('data_versao_gtfs') }}', date('{{ var('DATA_GTFS_V5_INICIO') }}'))"
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          name: dbt_expectations__expect_table_aggregation_to_equal_other_table__servico_sentido__ordem_servico_trajeto_alternativo_sentido
          config:
            where: "feed_start_date >= date('{{ var('DATA_GTFS_V5_INICIO') }}')"
          arguments:
            expression: count(distinct evento)
            compare_model: ref("ordem_servico_trips_shapes_gtfs")
            compare_expression: "count(distinct regexp_extract(vista, r'(\\[.*?\\])'))"
            group_by:
              - servico
              - left(sentido, 1)
            compare_group_by:
              - servico
              - "if(sentido = 'C', 'I', sentido)"
            row_condition: "feed_start_date = greatest('{{ var('data_versao_gtfs') }}', date('{{ var('DATA_GTFS_V5_INICIO') }}'))"
            compare_row_condition: "feed_start_date = greatest('{{ var('data_versao_gtfs') }}', date('{{ var('DATA_GTFS_V5_INICIO') }}')) and id_tipo_trajeto = 1"
      - dbt_utils.relationships_where:
          name: dbt_utils__relationships_where__servico_evento__ordem_servico_trajeto_alternativo_sentido
          config:
            where: "1=1"
          arguments:
            column_name: "concat(servico, '||', evento)"
            to: ref("trips_gtfs")
            field: "concat(trip_short_name, '||', regexp_extract(trip_headsign, r'(\\[.*?\\])'))"
            from_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}' and feed_start_date >= date('{{ var('DATA_GTFS_V5_INICIO') }}')"
            to_condition: "feed_start_date = '{{ var('data_versao_gtfs') }}' and feed_start_date >= date('{{ var('DATA_GTFS_V5_INICIO') }}')"
    columns:
      - name: feed_start_date
        description: "{{ doc('feed_start_date') }}"
      - name: feed_end_date
        description: "{{ doc('feed_end_date') }}"
      - name: feed_version
        description: "{{ doc('feed_version') }}"
      - name: servico
        description: "{{ doc('servico_variacao') }}"
      - name: consorcio
        description: "Nome do consórcio responsável pelo serviço"
      - name: vista
        description: "{{ doc('vista') }}"
      - name: sentido
        description: "{{ doc('sentido') }}"
      - name: ativacao
        description: "Modo de ativação do trajeto alternativo"
      - name: descricao
        description: "Descrição sobre o trajeto alternativo"
      - name: evento
        description: "Evento relacionado ao trajeto alternativo"
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              name: dbt_expectations__expect_column_values_to_match_regex__evento__ordem_servico_trajeto_alternativo_sentido
              config:
                where: "feed_start_date = '{{ var('data_versao_gtfs') }}' and feed_start_date >= date('{{ var('DATA_GTFS_V5_INICIO') }}')"
              arguments:
                regex: '^\[[a-z0-9_]+\]$'
                is_raw: true
      - name: extensao
        description: "{{ doc('extensao') }}"
      - name: versao_modelo
        description: "{{ doc('versao') }}"
      - name: tipo_os
        description: "{{ doc('tipo_os') }}"
