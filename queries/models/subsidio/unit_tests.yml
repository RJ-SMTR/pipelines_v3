version: 2

unit_tests:
  - name: test_sppo_janela_vespera_viagem_completa_aux_viagem_transacao
    model: aux_viagem_transacao
    overrides:
      vars:
        sistema: sppo
        start_date: "2026-07-20T00:00:00"
        end_date: "2026-07-20T00:00:00"
    given:
      - input: ref('viagem_regularidade_temperatura')
        format: csv
        fixture: viagem_regularidade_temperatura__aux_viagem_transacao__sppo
      - input: ref('transacao')
        format: csv
        fixture: transacao__aux_viagem_transacao__sppo
      - input: ref('transacao_riocard')
        format: csv
        fixture: vazio
      - input: source('rj_smtr_projeto_subsidio_sppo', 'viagem_completa')
        format: csv
        fixture: viagem_valida__viagem_completa__aux_viagem_transacao__sppo
      - input: source('rj_smtr_monitoramento', 'viagem_valida')
        format: csv
        fixture: viagem_valida__viagem_completa__aux_viagem_transacao__sppo
    expect:
      format: csv
      fixture: aux_viagem_transacao__viagem_completa

  - name: test_real_sppo_aux_viagem_transacao
    model: aux_viagem_transacao
    overrides:
      vars:
        sistema: sppo
        start_date: "2026-08-02T00:00:00"
        end_date: "2026-08-02T00:00:00"
    given:
      - input: ref('viagem_regularidade_temperatura')
        format: csv
        fixture: viagem_regularidade_temperatura__aux_viagem_transacao__sppo__producao
      - input: ref('transacao')
        format: csv
        fixture: transacao__aux_viagem_transacao__sppo__producao
      - input: ref('transacao_riocard')
        format: csv
        fixture: vazio
      - input: source('rj_smtr_monitoramento', 'viagem_valida')
        format: csv
        fixture: viagem_valida__aux_viagem_transacao__sppo__producao
      - input: source('rj_smtr_projeto_subsidio_sppo', 'viagem_completa')
        format: csv
        fixture: vazio
    expect:
      format: csv
      fixture: aux_viagem_transacao__viagem_valida__producao

