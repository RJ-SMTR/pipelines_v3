version: 2

models:
  - name: view_viagem_climatizacao
    description: "Dados do status dos veículos para o painel de climatização do Subsídio SPPO."
    columns:
      - name: consorcio
        description: "{{ doc('nome_consorcio') }}"
      - name: data
        description: "{{ doc('data_viagem') }}"
      - name: servico
        description: "{{ doc('servico') }}"
      - name: id_validador
        description: "{{ doc('id_validador') }}"
      - name: hora
        description: "{{ doc('hora') }}"
      - name: id_viagem
        description: "{{ doc('id_viagem') }}"
      - name: datetime_partida
        description: "{{ doc('datetime_partida') }}"
      - name: ano_fabricacao
        description: "{{ doc('ano_fabricacao') }}"
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
      - name: indicador_regularidade_temperatura
        description: "Indicador de regularidade da temperatura da viagem"
      - name: operadora
        description: "{{ doc('operadora') }}"

  - name: view_gps_onibus_8_dias
    description: >
      Posições GPS dos ônibus em operação nos últimos 8 dias, excluindo veículos
      parados em garagem, para o painel GPS dos Ônibus.
    columns:
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
      - name: servico
        description: "{{ doc('servico') }}"
      - name: latitude
        description: "{{ doc('latitude_gps') }}"
      - name: longitude
        description: "{{ doc('longitude_gps') }}"
      - name: data
        description: "{{ doc('data_gps') }}"
      - name: hora
        description: "{{ doc('hora_gps') }}"
      - name: timestamp_gps
        description: "{{ doc('timestamp_gps') }}"

  - name: view_shape_onibus
    description: >
      Itinerários planejados dos ônibus, com a geometria do
      shape, para o painel GPS dos Ônibus.
    columns:
      - name: trip_short_name
        description: "{{ doc('servico') }}"
      - name: shape_id
        description: "{{ doc('shape_id') }}"
      - name: data
        description: "{{ doc('data_viagem') }}"
      - name: shape
        description: "{{ doc('shape') }}"
      - name: data_versao
        description: "{{ doc('feed_start_date') }}"
      - name: vista
        description: "{{ doc('vista') }}"
      - name: sentido
        description: "{{ doc('sentido') }}"

