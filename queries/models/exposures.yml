version: 2

exposures:
  - name: sistema_ia_processamento_documento_transito
    type: application
    description: >
      Solução tecnológica com a finalidade de promover o processamento inteligente de
      documentos digitais relacionados a multas por infração de trânsito, executando
      triagem e análise voltadas à otimização dos fluxos administrativos, com extração
      de informações necessárias à identificação e classificação por tipo de solicitação.

    owner:
      name: TR/SUBG
      email: leandrorodrigues@prefeitura.rio
      roles:
        - Owner
        - Business Data Steward

    depends_on:
      - ref('autuacao')

    config:
      meta:
        data_product_name: Solução tecnológica de processamento inteligente de documentos de trânsito
        data_usage_frequency: daily
        business_value: >
          Automatizar a validação de dados extraídos por IA em recursos de autuação de trânsito,
          reduzindo retrabalho, acelerando a análise processual e aumentando a confiabilidade das
          informações utilizadas pela SMTR.
        data_contract: TED_007-26_DTDI/SUBG
        technical_data_steward:
          email: guilherme.hcbotelho@prefeitura.rio
          unit: IPLANRIO/PRE/VPIA/DTDI
          core: Inovação
          team:
            - rodrigo.fcunha@prefeitura.rio
            - victormiguel@prefeitura.rio

  - name: PAINEL_SENSORES_AR_CONDICIONADO
    type: dashboard
    description: >
      Painel de Sensores de Ar-Condicionado. Consome `view_viagem_climatizacao`.
    owner:
      name: TR/SUBTT/CMO
      email: marcio.caldeira@prefeitura.rio
      roles:
        - Owner
        - Business Data Steward
    depends_on:
      - ref('view_viagem_climatizacao')
    config:
      meta:
        data_product_name: Painel de Sensores de Ar-Condicionado
        data_usage_frequency: null
        business_value: null
        data_contract: null
        technical_data_steward:
          email: victormiguel@prefeitura.rio
          unit: IPLANRIO/PRE/VPIA/DTDI
          core: Subsídio
          team:
            - janaina.duarte@prefeitura.rio
            - adriano.neto@prefeitura.rio
            - rodrigo.fcunha@prefeitura.rio

  - name: PAINEL_RIO_ROTATIVO_DIGITAL
    type: dashboard
    description: >
      Painel com a finalidade de monitorar as ativações do Rio Rotativo Digital
      por dia, hora e área de estacionamento, apoiando o acompanhamento da
      ocupação das vagas e da operação do sistema.
    owner:
      name: TR/SUBTT/CMO
      email: marcio.caldeira@prefeitura.rio
      roles:
        - Owner
        - Business Data Steward
    depends_on:
      - ref('view_ativacao_dia_riorotativo')
      - ref('view_ativacao_hora_riorotativo')
    config:
      meta:
        data_product_name: Painel Rio Rotativo Digital
        data_usage_frequency: null
        business_value: null
        data_contract: null
        technical_data_steward:
          email: rafael.pinheiro@prefeitura.rio
          unit: IPLANRIO/PRE/VPIA/DTDI
          core: Bilhetagem
          team:
            - rafael.pinheiro@prefeitura.rio
            - adriano.neto@prefeitura.rio

  - name: transacao_dcr
    description: >
      # Data Clean Room para consulta dos dados de transação da bilhetagem digital (Jaé)

      **Valor Institucional / Propósito:** Criar a possibilidade de analisar os dados de bilhetagem utilizando a identificação de cliente de forma segura.

      **Contexto Operacional:**
      - Granularidade: Uma linha por registro de transação de bilhetagem.
      - Estado: Representa o estado histórico de uso.
      - Chaves de relacionamento: Utilize `id_transacao` e `hash_cliente_cartao`.
      - Fonte de verdade: Tabela `rj-smtr-private.bilhetagem.transacao` (réplica da `rj-smtr.bilhetagem.transacao`).
      - Premissas ou filtros: A privacidade dos dados é garantida através de uma Política de Agregação com limite mínimo de 5 registros (threshold) e utilizando `hash_cliente_cartao` como coluna de unidade de privacidade.

    owner:
      email: "lauro.silvestre@prefeitura.rio"

    maturity: high

    config:
      tags:
        - "Tier.Tier2"

    meta:
      openmetadata:
        domain: "bilhetagem_receita.transacao"
        open_metadata_fqn: "transacao_dcr"
