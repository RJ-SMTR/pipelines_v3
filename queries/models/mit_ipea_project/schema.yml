models:
  - name: survey_journeys
    description: |
      Uma linha por viagem (transações seguidas em um intevalo de 180 minutos). Contém as informações de embarque, 4 opções de desambarque e o nível de confiança da previsão.
      Dados a partir de 2026-11-01 e apenas dos voluntários para envio das mensagens da pesquisa de matriz OD.
      Fonte:
        - bilhetagem.transacao (dados de transação da Jaé);
        - monitoramento.view_gps_onibus (dados de gps dos ônibus);
        -  gtfs.trips, gtfs.stop_times, gtfs.stops, gtfs.routes (dados do GTFS)
    columns:
      - name: journey_key
        description: "{{ doc('journey_key') }}"
        data_type: string
      - name: rider_id
        description: Hash identificador do cliente que efetuou a viagem [protegido]
        data_type: bytes
        policy_tags:
          - 'projects/rj-smtr/locations/us/taxonomies/3816523328506695485/policyTags/2168539910400644199'
      - name: service_date
        description: "{{ doc('data_transacao' ) }} [partição]"
        data_type: date
      - name: rider_document
        description: Documento do cliente que efetuou a viagem [protegido]
        data_type: string
        policy_tags:
          - 'projects/rj-smtr/locations/us/taxonomies/3816523328506695485/policyTags/2168539910400644199'
      - name: first_trip_sequence
        description: trip_sequence (inteiro sequencial por dia e rider_id) da primeira transação da viagem
        data_type: int64
      - name: final_trip_sequence
        description: trip_sequence (inteiro sequencial por dia e rider_id) da última transação da viagem
        data_type: int64
      - name: n_transfers
        description: Quantidade de integrações feitas na viagem
        data_type: int64
      - name: boarding_time
        description: Horário de embarque da primeira transação da viagem [GMT-3]
        data_type: time
      - name: boarding_mode
        description: "{{ doc('modo' ) }} da primeira transação da viagem"
      - name: boarding_servico
        description: "{{ doc('servico_variacao' ) }} da primeira transação da viagem"
        data_type: string
      - name: boarding_descricao_servico
        description: "{{ doc('descricao_servico_cadastro' ) }} da primeira transação da viagem"
        data_type: string
      - name: boarding_neighborhood
        description: "Nome do bairro da primeira transação da viagem"
        data_type: string
      - name: boarding_tap_location
        description: Ponto geográfico no sistema de referência WGS84 da primeira transação da viagem
        data_type: geography
      - name: boarding_stop_id
        description: stop_id do GTFS em que o cliente embarcou na primeira transação da viagem
        data_type: string
      - name: boarding_stop_name
        description: stop_name do GTFS em que o cliente embarcou na primeira transação da viagem
        data_type: string
      - name: final_leg_boarding_time
        description: Horário de embarque da última transação da viagem [GMT-3]
        data_type: time
      - name: alighting_servico
        description: "{{ doc('servico_variacao' ) }} da última transação da viagem"
        data_type: string
      - name: alighting_time
        description: Horário de desambarque cálculado da última transação da viagem [GMT-3]
        data_type: time
      - name: predicted_walk_distance_m
        description: Distância entre o local de desambarque cálculado da última transação da viagem e a local de embarque da próxima viagem
        data_type: float64
      - name: runner_up_walk_distance_m
        description: Distância entre o local desambarque cálculado em segundo lugar da última transação da viagem e a local de embarque da próxima viagem
        data_type: float64
      - name: alighting_within_walk_cap
        description: Indica se o a distância entre o desembarque e o próximo embarque está dentro do limite para caminhada
        data_type: boolean
      - name: confidence_tier
        description: Nível de confiança da previsão
        data_type: string
      - name: direction_source
        description: Fonte do dado de sentido da linha [transacao, gps inferred]
        data_type: string
      - name: stop_id_1
        description: Primeira opção de stop_id do GTFS para desembarque da viagem
        data_type: string
      - name: stop_id_2
        description: Segunda opção de stop_id do GTFS para desembarque da viagem
        data_type: string
      - name: stop_id_3
        description: Terceira opção de stop_id do GTFS para desembarque da viagem
        data_type: string
      - name: stop_id_4
        description: Quarta opção de stop_id do GTFS para desembarque da viagem
        data_type: string
      - name: stop_name_1
        description: "Primeira {{ doc('survey_journey_opcao_stop_name' ) }}"
        data_type: string
      - name: stop_name_2
        description: "Segunda {{ doc('survey_journey_opcao_stop_name' ) }}"
        data_type: string
      - name: stop_name_3
        description: "Terceira {{ doc('survey_journey_opcao_stop_name' ) }}"
        data_type: string
      - name: stop_name_4
        description: "Quarta {{ doc('survey_journey_opcao_stop_name' ) }}"
        data_type: string
      - name: prediction_slot
        data_type: int64
        description: Número da última opção considerada como 'prediction'
  - name: view_journey_image
    description: |-
      Uma linha por viagem. Contém dados para envios de mensagens para a pesquisa da Matriz OD.
      Esta view apenas monta o endereço da imagem, não verifica a existência da imagem no GCS.
      Use journey_key para associar as linhas às jornadas.
      Fonte: rj-smtr.mit_ipea_project. survey_journeys e rj-smtr-sandbox.mit_ipea_project.voluntario_disparo_mensagem
    columns:
      - name: service_date
        description: "{{ doc('data_transacao' ) }} [partição]"
        data_type: date
      - name: journey_key
        description: "{{ doc('journey_key') }}"
        data_type: string
      - name: cpf
        description: Documento do cliente que efetuou a viagem [protegido]
        data_type: string
      - name: nome
        description: Nome do cliente que efetuou a viagem [protegido]
        data_type: string
      - name: telefone
        description: Telefone do cliente que efetuou a viagem [protegido]
        data_type: string
      - name: local_embarque
        description: Nome do ponto, estação ou bairro em que foi feito o embarque
        data_type: string
      - name: turno
        description: Turno do embarque embarque [de manhã, à tarde, à noite e de madrugada]
        data_type: string
      - name: parada_a
        description: "Primeira {{ doc('survey_journey_opcao_stop_name' ) }}"
        data_type: string
      - name: parada_b
        description: "Segunda {{ doc('survey_journey_opcao_stop_name' ) }}"
        data_type: string
      - name: parada_c
        description: "Terceira {{ doc('survey_journey_opcao_stop_name' ) }}"
        data_type: string
      - name: parada_d
        description: "Quarta {{ doc('survey_journey_opcao_stop_name' ) }}"
        data_type: string
      - name: link_imagem
        description: Link da imagem com as opções de stops do desembarque da viagem
        data_type: string
