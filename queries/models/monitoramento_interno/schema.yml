version: 2

models:
  - name: viagem_inferida
    description: "Viagens inferidas a partir dos dados de GPS"
    columns:
      - name: data
        description: "{{ doc('data_viagem') }} [partição]"
        data_type: date
      - name: id_viagem
        description: "{{ doc('id_viagem') }}"
        data_type: string
      - name: id_viagem_planejada
        description: "{{ doc('id_viagem_planejada') }}"
        data_type: string
      - name: datetime_partida
        description: "{{ doc('datetime_partida') }}"
        data_type: datetime
      - name: datetime_chegada
        description: "{{ doc('datetime_chegada') }}"
        data_type: datetime
      - name: modo
        description: "{{ doc('modo') }}"
        data_type: string
      - name: consorcio
        description: "{{ doc('consorcio') }}"
        data_type: string
      - name: sistema
        description: "{{ doc('sistema') }}"
        data_type: string
      - name: servico_gps
        description: "Serviço informado pelo GPS no momento da partida"
        data_type: string
      - name: servico
        description: "{{ doc('servico') }}"
        data_type: string
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_type: string
      - name: trip_id
        description: "{{ doc('trip_id') }}"
        data_type: string
      - name: shape_id
        description: "Identificador de um shape da tabela shapes do GTFS"
        data_type: string
      - name: sentido
        description: "{{ doc('sentido') }}"
        data_type: string
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
        data_type: string
      - name: fonte_gps
        description: Fornecedor de dados de GPS a ser considerado para validar a viagem
        data_type: string
      - name: distancia_planejada
        description: "{{ doc('distancia_planejada') }}"
        data_type: float64
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
        data_type: datetime
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
        data_type: string
  - name: view_viagem_monitoramento
    description: "Uma linha por viagem realizada em uma interface histórica para painéis internos. Use `id_viagem` como chave de junção. Fontes: `viagem_completa` para partidas anteriores a `DATA_SUBSIDIO_V25_INICIO` e `viagem_valida` a partir dessa data. O corte considera a data da partida; no período legado, `route_id` não está disponível e `modo` é fixado como Ônibus."
    columns:
      - name: data
        description: "{{ doc('data_viagem') }}"
        data_type: date
      - name: id_viagem
        description: "{{ doc('id_viagem') }}"
        data_type: string
      - name: id_empresa
        description: "{{ doc('id_empresa') }}"
        data_type: string
      - name: datetime_partida
        description: "{{ doc('datetime_partida') }}"
        data_type: datetime
      - name: datetime_chegada
        description: "{{ doc('datetime_chegada') }}"
        data_type: datetime
      - name: modo
        description: "{{ doc('modo') }}"
        data_type: string
      - name: sistema
        description: "{{ doc('sistema') }}"
        data_type: string
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
        data_type: string
      - name: vista
        description: "{{ doc('vista') }}"
        data_type: string
      - name: consorcio
        description: "{{ doc('consorcio') }}"
        data_type: string
      - name: servico_gps
        description: "{{ doc('servico_gps') }}"
        data_type: string
      - name: servico
        description: "{{ doc('servico') }}"
        data_type: string
      - name: route_id
        description: "{{ doc('route_id') }}"
        data_type: string
      - name: trip_id
        description: "{{ doc('trip_id') }}"
        data_type: string
      - name: shape_id
        description: "{{ doc('shape_id') }}"
        data_type: string
      - name: sentido
        description: "{{ doc('sentido') }}"
        data_type: string
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
        data_type: string
      - name: distancia_planejada
        description: "{{ doc('distancia_planejada') }}"
        data_type: float64
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
        data_type: datetime
      - name: versao
        description: "{{ doc('versao') }}"
        data_type: string
  - name: monitoramento_sumario_servico_dia_historico
    description: "Viagens sumario serviço dia histórico"
    columns:
      - name: data
        description: "{{ doc('data_viagem') }} [partição]"
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
      - name: consorcio
        description: "{{ doc('consorcio') }}"
      - name: servico
        description: "{{ doc('servico') }}"
      - name: vista
        description: "{{ doc('vista') }}"
      - name: viagens
        description: "Viagens realizadas"
      - name: km_apurada
        description: "{{ doc('km_apurada') }}"
      - name: km_planejada
        description: "{{ doc('km_planejada') }}"
      - name: perc_km_planejada
        description: "{{ doc('perc_km_planejada') }}"
      - name: valor_subsidio_pago
        description: "{{ doc('valor_subsidio_pago') }}"
      - name: valor_penalidade
        description: "{{ doc('valor_penalidade') }}"
  - name: monitoramento_sumario_servico_dia_tipo_viagem_historico
    description: "Viagens sumario serviço dia tipo viagem histórico"
    columns:
      - name: data
        description: "{{ doc('data_viagem') }} [partição]"
      - name: tipo_dia
        description: "{{ doc('tipo_dia') }}"
      - name: consorcio
        description: "{{ doc('consorcio') }}"
      - name: servico
        description: "{{ doc('servico') }}"
      - name: tipo_viagem
        description: "{{ doc('tipo_viagem_status') }}"
