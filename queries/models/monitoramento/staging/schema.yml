version: 2

models:
  - name: staging_gps
    description: "Tabela com todos os registros de GPS da API {{ var('fonte_gps') }}"
    latest_version: 1
    columns:
      - name: data
        description: "{{ doc('data_captura') }}"
      - name: hora
        description: "{{ doc('hora_captura') }}"
      - name: datetime_gps
        description: "{{ doc('datetime_gps') }}"
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
      - name: servico
        description: "{{ doc('servico') }}"
      - name: sentido
        description: "{{ doc('sentido') }}"
      - name: latitude
        description: "{{ doc('latitude_gps') }}"
      - name: longitude
        description: "{{ doc('longitude_gps') }}"
      - name: velocidade
        description: "{{ doc('velocidade_instantanea') }}"
      - name: direcao
        description: "{{ doc('direcao_gps') }}"
      - name: route_id
        description: "{{ doc('route_id') }}"
      - name: trip_id
        description: "{{ doc('trip_id') }}"
      - name: shape_id
        description: "{{ doc('shape_id') }}"
      - name: datetime_envio
        description: "{{ doc('datetime_envio_gps') }}"
      - name: datetime_servidor
        description: "{{ doc('datetime_servidor_gps') }}"
      - name: datetime_captura
        description: "{{ doc('datetime_captura') }}"
    versions:
      - v: 1
        defined_in: staging_gps
        tests:
          - check_gps_capture:
              name: check_gps_capture__staging_gps
              arguments:
                table_id: registros
                interval: 1
        columns:
          - include: all
          - name: datetime_execucao_flow
            description: Data e hora de execução do flow de captura
            data_type: datetime
      - v: 2
        defined_in: staging_gps_v2
        description: "Tabela com todos os registros de GPS do payload versionado"
        tests:
          - check_gps_capture_v2:
              name: check_gps_capture__staging_gps_v2
              arguments:
                table_id: registros
                interval: 1
              config:
                severity: warn
        columns:
          - include: all
          - name: id_registro
            description: "{{ doc('id_registro_gps') }}"
            data_type: string
            tests:
              - not_null:
                  name: not_null__id_registro__staging_gps_v2
              - unique:
                  name: unique__id_registro__staging_gps_v2
          - name: datetime_envio
            description: "{{ doc('datetime_envio_gps') }}"
            data_type: datetime
          - name: datetime_servidor
            description: "{{ doc('datetime_servidor_gps') }}"
            data_type: datetime
          - name: id_equipamento
            description: "{{ doc('id_equipamento') }}"
            data_type: string
          - name: sequencial_equipamento
            description: "{{ doc('sequencial_equipamento') }}"
            data_type: int64
          - name: id_viagem_planejada
            description: "{{ doc('id_viagem_planejada') }}"
            data_type: string
          - name: direction_id
            description: "{{ doc('direction_id') }}"
            data_type: int64
          - name: qualidade_sinal
            description: "{{ doc('qualidade_sinal') }}"
            data_type: string
          - name: fonte_posicao
            description: "{{ doc('fonte_posicao') }}"
            data_type: string
          - name: fonte_velocidade
            description: "{{ doc('fonte_velocidade') }}"
            data_type: string
          - name: altitude
            description: "{{ doc('altitude_gps') }}"
            data_type: float64
          - name: quantidade_satelites
            description: "{{ doc('quantidade_satelites') }}"
            data_type: int64
          - name: hdop
            description: "{{ doc('hdop') }}"
            data_type: float64
          - name: vdop
            description: "{{ doc('vdop') }}"
            data_type: float64
          - name: pdop
            description: "{{ doc('pdop') }}"
            data_type: float64
  - name: aux_gps_filtrada
    description: "Registros de GPS filtrados pela caixa geográfica do município"
    latest_version: 1
    columns:
      - name: data
        description: "{{ doc('data_captura') }}"
        data_type: date
      - name: hora
        description: "{{ doc('hora_captura') }}"
        data_type: int64
      - name: datetime_gps
        description: "{{ doc('datetime_gps') }}"
        data_type: datetime
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
        data_type: string
      - name: servico
        description: "{{ doc('servico') }}"
        data_type: string
      - name: latitude
        description: "{{ doc('latitude_gps') }}"
        data_type: float64
      - name: longitude
        description: "{{ doc('longitude_gps') }}"
        data_type: float64
      - name: posicao_veiculo_geo
        description: "Ponto geográfico da posição do veículo"
        data_type: geography
      - name: datetime_captura
        description: "{{ doc('datetime_captura') }}"
        data_type: datetime
      - name: velocidade
        description: "{{ doc('velocidade_instantanea') }}"
        data_type: float64
    versions:
      - v: 1
        defined_in: aux_gps_filtrada
      - v: 2
        defined_in: aux_gps_filtrada_v2
        description: "Registros do payload GPS v2 dentro da caixa geográfica do município"
        columns:
          - include: all
          - name: id_registro
            description: "{{ doc('id_registro_gps') }}"
            data_type: string
            tests:
              - not_null:
                  name: not_null__id_registro__aux_gps_filtrada_v2
              - unique:
                  name: unique__id_registro__aux_gps_filtrada_v2
          - name: datetime_envio
            description: "{{ doc('datetime_envio_gps') }}"
            data_type: datetime
          - name: datetime_servidor
            description: "{{ doc('datetime_servidor_gps') }}"
            data_type: datetime
          - name: id_equipamento
            description: "{{ doc('id_equipamento') }}"
            data_type: string
          - name: sequencial_equipamento
            description: "{{ doc('sequencial_equipamento') }}"
            data_type: int64
          - name: route_id
            description: "{{ doc('route_id') }}"
            data_type: string
          - name: id_viagem_planejada
            description: "{{ doc('id_viagem_planejada') }}"
            data_type: string
          - name: trip_id
            description: "{{ doc('trip_id') }}"
            data_type: string
          - name: shape_id
            description: "{{ doc('shape_id') }}"
            data_type: string
          - name: direction_id
            description: "{{ doc('direction_id') }}"
            data_type: int64
          - name: sentido
            description: "{{ doc('sentido') }}"
            data_type: string
          - name: qualidade_sinal
            description: "{{ doc('qualidade_sinal') }}"
            data_type: string
          - name: fonte_posicao
            description: "{{ doc('fonte_posicao') }}"
            data_type: string
          - name: fonte_velocidade
            description: "{{ doc('fonte_velocidade') }}"
            data_type: string
          - name: altitude
            description: "{{ doc('altitude_gps') }}"
            data_type: float64
          - name: direcao
            description: "{{ doc('direcao_gps') }}"
            data_type: float64
          - name: quantidade_satelites
            description: "{{ doc('quantidade_satelites') }}"
            data_type: int64
          - name: hdop
            description: "{{ doc('hdop') }}"
            data_type: float64
          - name: vdop
            description: "{{ doc('vdop') }}"
            data_type: float64
          - name: pdop
            description: "{{ doc('pdop') }}"
            data_type: float64

  - name: aux_gps_velocidade
    description: "Cálculo de velocidade, distância e movimento dos registros de GPS"
    latest_version: 1
    versions:
      - v: 1
        defined_in: aux_gps_velocidade
      - v: 2
        defined_in: aux_gps_velocidade_v2

  - name: aux_gps_parada
    description: "Classificação das paradas dos registros de GPS"
    latest_version: 1
    versions:
      - v: 1
        defined_in: aux_gps_parada
      - v: 2
        defined_in: aux_gps_parada_v2

  - name: aux_gps_trajeto_correto
    description: "Identificação da aderência dos registros de GPS ao trajeto planejado"
    latest_version: 1
    versions:
      - v: 1
        defined_in: aux_gps_trajeto_correto
      - v: 2
        defined_in: aux_gps_trajeto_correto_v2

  - name: staging_realocacao
    description: "Tabela com todas as realocações de linha informadas pela API {{ var('fonte_gps') }}"
    tests:
      - check_gps_capture:
          name: check_gps_capture__staging_realocacao
          arguments:
            table_id: realocacao
            interval: 10
    columns:
      - name: data
        description: "{{ doc('data_captura') }}"
      - name: hora
        description: "{{ doc('hora_captura') }}"
      - name: datetime_operacao
        description: "{{ doc('datetime_operacao') }}"
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
      - name: servico
        description: "{{ doc('servico_realocacao') }}"
      - name: datetime_entrada
        description: "{{ doc('datetime_entrada') }}"
      - name: datetime_saida
        description: "{{ doc('datetime_saida') }}"
      - name: datetime_processamento
        description: "{{ doc('datetime_processamento') }}"
      - name: datetime_captura
        description: "{{ doc('datetime_captura') }}"
  - name: aux_veiculo_falha_ar_condicionado
    description: "Tabela auxiliar para controle de falhas consecutivas de ar condicionado por veículo"
    columns:
      - name: data
        description: "{{ doc('data') }} [partição]"
        tests:
          - not_null:
              name: not_null__data__aux_veiculo_falha_ar_condicionado
      - name: id_veiculo
        description: "{{ doc('id_veiculo') }}"
        tests:
          - not_null:
              name: not_null__id_veiculo__aux_veiculo_falha_ar_condicionado
      - name: placa
        description: "{{ doc('placa') }}"
      - name: ano_fabricacao
        description: "{{ doc('ano_fabricacao') }}"
      - name: indicador_ar_condicionado
        description: "{{ doc('indicador_ar_condicionado') }}"
      - name: data_processamento_licenciamento
        description: "Data de processamento do licenciamento do veículo"
      - name: data_verificacao_regularidade
        description: "{{ doc('data_verificacao_regularidade') }}"
      - name: indicador_temperatura_variacao_veiculo
        description: "{{ doc('indicador_temperatura_variacao_veiculo') }}"
      - name: indicador_temperatura_transmitida_veiculo
        description: "{{ doc('indicador_temperatura_transmitida_veiculo') }}"
      - name: percentual_viagem_temperatura_pos_tratamento_descartada
        description: "{{ doc('percentual_viagem_temperatura_pos_tratamento_descartada') }}"
      - name: percentual_temperatura_pos_tratamento_descartada
        description: "{{ doc('percentual_temperatura_pos_tratamento_descartada') }}"
      - name: indicador_temperatura_descartada_veiculo
        description: "{{ doc('indicador_temperatura_descartada_veiculo') }}"
      - name: indicador_viagem_temperatura_descartada_veiculo
        description: "{{ doc('indicador_viagem_temperatura_descartada_veiculo') }}"
      - name: indicio_falha
        description: "Indicador de indício de falha no sistema de ar condicionado"
      - name: quantidade_dia_falha_operacional
        description: "{{ doc('quantidade_dia_falha_operacional') }}"
        tests:
          - not_null:
              name: not_null__quantidade_dia_falha_operacional__aux_veiculo_falha_ar_condicionado
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
      - name: versao
        description: "{{ doc('versao') }}"
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
  - name: temperatura_inmet
    description: "Tabela com dados de temperatura das estações meteorológicas do INMET"
    tests:
      - test_completude_temperatura_inmet:
          name: test_completude__temperatura_inmet
          config:
            severity: warn
            where: "data between date('{date_range_start}') and date_add(date('{date_range_end}'), interval 1 day)"
    columns:
      - name: data
        description: "{{ doc('data') }} [partição]"
        tests:
          - not_null:
              name: not_null__data__temperatura_inmet
      - name: hora
        description: "Hora da medição meteorológica"
        tests:
          - not_null:
              name: not_null__hora__temperatura_inmet
      - name: id_estacao
        description: "Identificador da estação meteorológica do INMET"
        tests:
          - not_null:
              name: not_null__id_estacao__temperatura_inmet
      - name: temperatura
        description: "Temperatura medida pela estação meteorológica (°C)"
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
      - name: versao
        description: "{{ doc('versao') }}"
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
  - name: temperatura_alertario
    description: "Tabela com dados de temperatura das estações meteorológicas do Sistema de Alerta Rio"
    tests:
      - test_completude_temperatura:
          name: test_completude__temperatura_alertario
          config:
            severity: warn
            where: "data between date('{date_range_start}') and date('{date_range_end}')"
          arguments:
            expected_qtd: 96
    columns:
      - name: data
        description: "{{ doc('data') }} [partição]"
        tests:
          - not_null:
              name: not_null__data__temperatura_alertario
      - name: hora
        description: "Hora da medição meteorológica"
        tests:
          - not_null:
              name: not_null__hora__temperatura_alertario
      - name: id_estacao
        description: "Identificador da estação meteorológica do Sistema de Alerta Rio"
        tests:
          - not_null:
              name: not_null__id_estacao__temperatura_alertario
      - name: temperatura
        description: "Temperatura medida pela estação meteorológica (°C)"
      - name: datetime_ultima_atualizacao
        description: "{{ doc('datetime_ultima_atualizacao') }}"
      - name: versao
        description: "{{ doc('versao') }}"
      - name: id_execucao_dbt
        description: "{{ doc('id_execucao_dbt') }}"
