version: 1.0.0
kind: DataContract
apiVersion: v3.2.0
id: urn:datacontract:riorotativo:base_guardador_veiculo_riorotativo
name: riorotativo/base_guardador_veiculo_riorotativo
status: draft
schema:
- name: base_guardador_veiculo_riorotativo
  physicalType: ephemeral
  description: |
    Base comum das abas de guardadores de veículo das entidades credenciadoras.
    Extrai cpf e identificacao do conteúdo aninhado e acrescenta data, cnpj e timestamp_captura
    para alimentar o staging. O contrato valida cpf e identificacao no CSV bruto antes do upload.
  logicalType: object
  physicalName: base_guardador_veiculo_riorotativo
  properties:
  - name: cpf
    physicalType: STRING
    description: CPF informado na aba da entidade credenciadora
    logicalType: string
    quality:
    - type: library
      metric: nullValues
      mustBe: 0
    primaryKey: true
    primaryKeyPosition: 1
  - name: identificacao
    physicalType: STRING
    description: Número de identificação informado para o guardador
    logicalType: string
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
  quality: []
customProperties:
- property: dbt_version
  value: 1.10.11
