version: 1.0.0
kind: DataContract
apiVersion: v3.1.0
id: urn:datacontract:riorotativo_staging:staging_guardador_veiculo_riorotativo
name: riorotativo_staging/staging_guardador_veiculo_riorotativo
status: active
schema:
- name: staging_guardador_veiculo_riorotativo
  physicalType: view
  description: |
    Uma linha por guardador de veículo (cpf) por entidade credenciadora (cnpj), por data de captura.
    Staging com os nomes das colunas da captura, deduplicado pela última captura de cada dia.
    As colunas cpf e identificacao são normalizadas no staging; os modelos consumidores apenas as renomeiam.
    Fonte: capturas diárias das entidades credenciadoras (source_riorotativo.entidade_<cnpj>).
    Contém apenas a presença no credenciamento — sem dados cadastrais nem bloqueio.
  logicalType: object
  physicalName: rj-smtr.riorotativo_staging.guardador_veiculo
  properties:
  - name: data
    physicalType: DATE
    description: Data da captura (partição)
    logicalType: date
  - name: cpf
    physicalType: STRING
    description: CPF do guardador de veículo
    logicalType: string
    primaryKey: true
    primaryKeyPosition: 1
    classification: restricted
  - name: identificacao
    physicalType: STRING
    description: Número de identificação do guardador de veículo
    logicalType: string
    quality:
    - type: library
      metric: duplicateValues
      mustBe: 0
    - type: library
      metric: nullValues
      mustBe: 0
  - name: cnpj
    physicalType: STRING
    description: CNPJ da entidade credenciadora associada ao guardador de veículo
    logicalType: string
  - name: timestamp_captura
    physicalType: STRING
    description: Timestamp de captura pela SMTR
    logicalType: string
  quality: []
customProperties:
- property: dbt_version
  value: 1.10.11
